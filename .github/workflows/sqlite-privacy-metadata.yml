name: Private SQLite metadata review

on:
  pull_request:
    branches: [master]
    paths:
      - "therapy_site/db.sqlite3"
      - "tools/audit_public_sqlite.py"
      - "tools/test_public_sqlite_audit.py"
      - ".github/workflows/sqlite-privacy-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-review:
    runs-on: ubuntu-latest
    steps:
