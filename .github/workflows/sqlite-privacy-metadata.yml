name: Private SQLite metadata review

on:
  pull_request:
    branches: [master]
    paths:
      - "therapy_site/db.sqlite3"
      - "tools/audit_public_sqlite.py"
      - "tools/test_public_sqlite_audit.py"
      - ".github/workflows/sqlite-privacy-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test metadata scanner with synthetic data
        working-directory: tools
        run: python -m unittest -v test_public_sqlite_audit.py
      - name: Report database schema and aggregate indicators only
        run: python tools/audit_public_sqlite.py therapy_site/db.sqlite3
