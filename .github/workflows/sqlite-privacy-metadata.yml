name: Private SQLite metadata review

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/audit_public_sqlite.py"
      - "tools/test_public_sqlite_audit.py"
      - ".github/workflows/sqlite-privacy-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test metadata scanner with synthetic data only
        working-directory: tools
        run: python -m unittest -v test_public_sqlite_audit.py
      # Never scan therapy_site/db.sqlite3 in public CI. The tracked database
      # is unreviewed and may contain sensitive records; inspect it only in an
      # appropriately private, authorized environment after a data-retention review.
