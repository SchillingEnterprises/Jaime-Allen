name: SQLite repository privacy guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-review:
    name: Tracked-file privacy guard and synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Inspect Git path metadata only. Never open, scan, or print database contents.
      - name: Reject tracked SQLite database files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          import sys

          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout.split(b"\0")
          sqlite_path = re.compile(rb"\.sqlite3?(?:[-.].*)?$", re.IGNORECASE)
          matches = [
              path.decode("utf-8", errors="backslashreplace")
              for path in tracked
              if path and sqlite_path.search(path)
          ]
          if matches:
              print(
                  "::error::Tracked SQLite database or sidecar files are prohibited. "
                  "Only Git path metadata was inspected; file contents were not opened."
              )
              for path in matches:
                  print(f"Tracked database path: {path}")
              sys.exit(1)
          print("No tracked SQLite database or sidecar paths found.")
          PY

      - name: Test metadata scanner with synthetic data only
        working-directory: tools
        run: python -m unittest -v test_public_sqlite_audit.py

      # Do not add a step that scans, exports, uploads, or logs real database data.
