name: Python dependency vulnerability audit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1" # Every Monday at 06:17 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit pinned Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"
      - name: Install pinned pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit direct and transitive requirements
        run: pip-audit --strict --requirement therapy_site/requirements.txt
